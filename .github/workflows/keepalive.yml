name: Render Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier cold starts
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allows you to run it manually from the Actions tab if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          # Replace the URL below with your actual Render backend URL once deployed.
          # For example: https://framesense-backend.onrender.com/health
          BACKEND_URL="https://framesense-pvpi.onrender.com/health"
          
          echo "Pinging $BACKEND_URL to keep it awake..."
          
          # -f fails on HTTP errors, -s hides progress bar, -S shows errors
          curl -f -s -S "$BACKEND_URL" || echo "Warning: Could not reach the backend (it might still be starting up or the URL is incorrect)."
