server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API calls are proxied by service name inside the Docker network --
    # the frontend code always calls the relative path /api/..., so no
    # backend URL is ever baked into the JS bundle.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
    }

    # Single-page app: any non-file route falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
