server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* and /uploads/* to the backend container.
    # Docker Compose networking resolves "backend" to the backend service.
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass         http://backend:8000/uploads/;
        proxy_set_header   Host $host;
    }

    # React SPA — send everything else to index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
